<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>  Golden Raspberry Awards </mat-card-title>
  </mat-card-header>
</mat-card>

<mat-tab-group>
  <mat-tab label="Dashboard">
    <div class="tab-content">
      <app-dashboard></app-dashboard>
    </div>
  </mat-tab>

  <mat-tab label="Lista de todos os filmes">
    <ng-template matTabContent>
      <div class="tab-content">
        <app-list></app-list>
      </div>
    </ng-template>
  </mat-tab>
</mat-tab-group>
