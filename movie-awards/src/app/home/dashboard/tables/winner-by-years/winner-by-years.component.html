<div class="shared-table-host">
  <div class="table-container mat-elevation-z8">
    <mat-card>
      <mat-card-header>
        <div mat-card-avatar></div>
        <mat-card-title>Pesquise o filme vencedor por ano</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="loadWinByYear()">
          <mat-form-field appearance="outline">
            <mat-label>Ano</mat-label>

            <input matInput type="number" formControlName="year" placeholder="Digite o ano" />

            <button matSuffix mat-icon-button type="submit" aria-label="Buscar" [disabled]="form.invalid">
              <mat-icon>search</mat-icon>
            </button>

            <mat-error *ngIf="form.get('year')?.hasError('required')">
              O ano é obrigatório.
            </mat-error>

            <mat-error *ngIf="form.get('year')?.hasError('min')">
              Informe um ano válido.
            </mat-error>
          </mat-form-field>
        </form>
        <table mat-table [dataSource]="winnerYears">

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> id </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
          </ng-container>

          <ng-container matColumnDef="ano">
            <th mat-header-cell *matHeaderCellDef> ano </th>
            <td mat-cell *matCellDef="let element"> {{element.year}} </td>
          </ng-container>

          <ng-container matColumnDef="título">
            <th mat-header-cell *matHeaderCellDef> título </th>
            <td mat-cell *matCellDef="let element"> {{element.title}} </td>
          </ng-container>

          <ng-container matColumnDef="estudios">
            <th mat-header-cell *matHeaderCellDef> estudios </th>
            <td mat-cell *matCellDef="let element"> {{element.studios}} </td>
          </ng-container>

          <ng-container matColumnDef="produtores">
            <th mat-header-cell *matHeaderCellDef> produtores </th>
            <td mat-cell *matCellDef="let element"> {{element.producers}} </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
</div>
